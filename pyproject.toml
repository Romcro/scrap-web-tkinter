[project]
name = "email-scraper"
version = "0.1.0"
description = "Outil de bureau d'extraction d'adresses e-mail publiées sur une liste de sites"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
files = ["app"]

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true
